[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decui"
version = "0.3.0"
description = "Declarative desktop ERP & business application framework for Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyrefly>=0.45.0",
    "pyside6>=6.6.0",
    "sqlalchemy>=2.0.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0"
]

[project.scripts]
decui = "decui.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["decui", "decui.*"]
namespaces = false

[tool.setuptools.package-data]
decui = ["py.typed", "docs/*.md"]

